on: [ push ]

name: build

# Единый барьер (фича 0090): CI прогоняет ВЕСЬ scripts/precheck.sh под строгим
# режимом. Логики гейтов в этом workflow НЕТ — только установка инструментов и
# один вызов скрипта. Причина: до 0090 CI нёс СВОЮ реализацию гейтов (SV) рядом
# с precheck.sh — два источника расходились (дрейф). Теперь источник один: гейт,
# добавленный в precheck.sh, автоматически идёт и в CI без правки этого файла.
# ADR: docs/adr/0090-ci-precheck.md.

jobs:
  ubuntu:
    name: Ubuntu — полный precheck.sh (строгий режим)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — полный клон С ТЕГАМИ (фича 0162). По умолчанию
      # actions/checkout берёт один коммит и тегов не выкачивает, а гейт метки
      # версии под PRECHECK_STRICT=1 требует их наличия: без тегов пропуск тега
      # неотличим от невыкачанных тегов. Задание windows правки не требует — оно
      # гоняет только cargo test, без precheck.sh.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Толчейн НЕ задаётся здесь: он зафиксирован в `rust-toolchain.toml`
      # (фича 0137), и rustup на раннере ставит именно его — вместе с
      # компонентами rustfmt и clippy, перечисленными в том же файле. Так версия
      # компилятора описана в ОДНОМ месте: дублировать её в workflow значит
      # завести второй источник истины, который разойдётся (урок фичи 0090).
      - name: Toolchain (пин из rust-toolchain.toml)
        run: rustup show active-toolchain && cargo --version && cargo fmt --version

      # Инструменты живых гейтов precheck.sh. python3, cc/gcc и git — уже на
      # образе ubuntu-latest. bison ≥ 2.4 + flex — для сборки MatIEC iec2c
      # (ubuntu несёт bison 3.x; на macOS системный 2.3 сборку валит).
      - name: Системные инструменты гейтов
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build verilator yosys \
            bison flex build-essential
          cmake --version | head -1
          ninja --version
          verilator --version | head -1
          yosys -V | head -1
          bison --version | head -1

      # Арбитр ST: собирается из исходников (лицензия открытая). Скрипт сам по
      # себе не валит сборку; строгость обеспечивает ST-гейт precheck.sh под
      # PRECHECK_STRICT=1 (нет iec2c → ОШИБКА, а не мягкий пропуск).
      - name: Сборка арбитра ST (MatIEC iec2c)
        run: ./scripts/ensure-iec2c.sh

      # PRECHECK_STRICT=1: в CI отсутствие любого инструмента гейта — ОШИБКА, а не
      # пропуск (пропущенный гейт зелёный, то есть неотличим от пройденного —
      # урок 0045). SV_GATE_REQUIRED наследует этот флаг внутри скрипта.
      # Под строгим режимом формат ПРОВЕРЯЕТСЯ (`fmt --check`), а не применяется.
      - name: precheck.sh (fmt-check + линты + тесты + живые гейты всех целей)
        env:
          PRECHECK_STRICT: 1
        run: ./scripts/precheck.sh

  # Windows — узкая проверка портируемости Rust-тестов (фича 0037). Job гоняет
  # `cargo test`, а НЕ весь precheck.sh. Отступление от принципа 0090 («логика
  # гейтов только в precheck.sh») осознанное: цель 0037 — доказать, что шесть
  # тестов (5 разбора `-I` в taktc + 1 `viewport`) работают на Windows, а не
  # прогнать аппаратные гейты C/SV/ST — verilator/yosys/iec2c на windows-latest
  # неподъёмны и к портируемости Rust-тестов отношения не имеют. Полный precheck
  # на Windows — вопрос отдельной фичи.
  #
  # continue-on-error (0037-03, R8): job неблокирующий, пока Windows не разобран —
  # иначе первый прогон, полный ещё не расклассифицированных чужих падений
  # (аппаратные тесты без инструментов), завалил бы весь CI. Флаг снимается
  # отдельным коммитом ПОСЛЕ первого зелёного прогона (критерий A11) — до тех пор
  # фича 0037 в ГОТОВО не переводится.
  #
  # ⚠️ CI Actions в проекте заблокирован по биллингу (как у 0090): job добавлен
  # готовым, но пока не исполняется, поэтому A8/A9/A11 остаются непроверёнными.
  windows:
    name: Windows — cargo test (портируемость, фича 0037)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Толчейн — из `rust-toolchain.toml` (фича 0137), см. комментарий выше.
      - name: Toolchain (пин из rust-toolchain.toml)
        run: rustup show active-toolchain && cargo --version

      # Однопоточно — как требуют CLAUDE.md и precheck.sh (иначе гонки за общие
      # файлы; на Windows с его блокировками файлов цена гонки выше).
      - name: cargo test (все фичи, однопоточно)
        run: cargo test --all-features -- --test-threads=1
