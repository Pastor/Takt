name = "BuT"
grammar = "but"
path_suffixes = ["but"]
line_comments = ["// ", "/// "]
autoclose_before = ";:.,=}])"
tab_size = 4
hard_tabs = false

# LSP-сервер для языка BuT.
# Для активации автодополнения и навигации установите `but-lsp` в PATH:
#   cargo install --path grammar --features lsp --bin but-lsp
[language_servers]
# language_server = { name = "but-lsp", binary = { path = "but-lsp" } }

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]

[overrides.identifier]
word_characters = ["_"]
