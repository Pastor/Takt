# Координаты и версии плагина IntelliJ для Lam (фича 0022, задача 0022-01).
# Диапазон совместимости IDE и версия платформы вынесены сюда (ADR 0022, R6).
pluginGroup = org.lam
pluginVersion = 0.4.0

# IntelliJ Platform: IC = IntelliJ IDEA Community (базовая подсветка не требует Ultimate).
# Линейка 2024.1.x — последняя на Java 17 (2024.2+ требует Java 21); фиксируемся на
# ней, чтобы сборка/тесты шли под JDK 17. Диапазон можно расширить при наличии JDK 21.
platformType = IC
platformVersion = 2024.1.7

# Нижняя граница сборок IDE. Верхняя граница НЕ задаётся (открытый диапазон):
# плагин использует только давно стабильные API платформы (FileType, Language,
# SyntaxHighlighter, LexerBase, Commenter, PairedBraceMatcher, ColorSettingsPage),
# поэтому совместим с новыми IDE (2024.2+, RustRover 261 и далее), несмотря на
# сборку под 2024.1.x/JDK 17. Пустое `pluginUntilBuild` убирает атрибут until-build.
pluginSinceBuild = 241
pluginUntilBuild =

# Стабильность/производительность Gradle.
org.gradle.configuration-cache = true
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
