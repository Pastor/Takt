[book]
title = "Язык Takt — описание"
authors = ["Pastor <viruszold@gmail.com>"]
language = "ru"
src = "src"
description = "Справочное описание языка Takt (Typed, Automata, Known Timing) — DSL для спецификации и синтеза конечных автоматов промышленных систем управления."

# Автонумерация разделов — из порядка в src/SUMMARY.md (mdBook нумерует
# перечисленные под `- [..]` главы автоматически).

# ВЫВОД ПО УМОЛЧАНИЮ — PDF (через mdbook-pandoc), а не HTML. HTML-бэкенд не
# подключён. Зависимости сборки — см. Makefile / README.md (mdbook, mdbook-pandoc,
# pandoc, TeX-движок xelatex, шрифт Fira Code).
[output.pandoc.profile.pdf]
output-file = "takt-language.pdf"
to = "pdf"
# Движок сборки — latexmk поверх xelatex: latexmk сам гоняет xelatex до сходимости
# перекрёстных ссылок (ToC, кросс-главные ссылки на приложения), в отличие от
# одиночного вызова xelatex. Так `make build` формирует корректные ссылки без
# ручных повторных проходов.
pdf-engine = "latexmk"
pdf-engine-opts = ["-xelatex", "-interaction=nonstopmode"]
# Подсветка синтаксиса Takt: KDE/kate-определение подключается в skylighting
# (движок pandoc). Блоки ```takt подсвечиваются согласно takt.kate.xml. Путь —
# относительно каталога book/ (откуда mdbook-pandoc запускает pandoc).
syntax-definitions = ["takt.kate.xml"]
highlight-style = "tango"

# Опции pandoc: оглавление с нумерацией разделов (дублирует автонумерацию mdBook в
# структуре документа), ссылки.
[output.pandoc.profile.pdf.variables]
# Шрифт ТЕКСТА документа — Fira Code (по требованию). Моноширинный шрифт кода —
# тоже Fira Code (единый вид). Требуется установленный в системе шрифт Fira Code
# (fontspec/xelatex резолвит по имени семейства).
mainfont = "Fira Code"
monofont = "Fira Code"
# У Fira Code нет курсивного начертания. Без синтетического курсива xelatex на
# каждом курсивном фрагменте (комментарии в подсветке кода `\CommentTok`,
# `\emph`-текст библиографии) печатает предупреждение «Font shape .../m/it
# undefined». AutoFakeSlant определяет наклонное начертание из прямого — курсив
# рендерится синтетически, предупреждения исчезают.
mainfontoptions = ["AutoFakeSlant=0.2"]
monofontoptions = ["AutoFakeSlant=0.2"]
fontsize = "10pt"
lang = "ru"
toc = true
toccolor = "black"
numbersections = true
colorlinks = true
linkcolor = "black"
urlcolor = "blue"
