[book]
title = "Язык Takt — описание"
authors = ["Pastor <viruszold@gmail.com>"]
language = "ru"
src = "src"
description = "Справочное описание языка Takt (Typed, Automata, Known Timing) — DSL для спецификации и синтеза конечных автоматов промышленных систем управления."

# Автонумерация разделов — из порядка в src/SUMMARY.md (mdBook нумерует
# перечисленные под `- [..]` главы автоматически).

# ВЫВОД ПО УМОЛЧАНИЮ — PDF (через mdbook-pandoc), а не HTML. HTML-бэкенд не
# подключён. Зависимости сборки — см. Makefile / README.md (mdbook, mdbook-pandoc,
# pandoc, TeX-движок xelatex, шрифт Fira Code).
[output.pandoc.profile.pdf]
output-file = "takt-language.pdf"
to = "pdf"
# Движок сборки — latexmk поверх xelatex: latexmk сам гоняет xelatex до сходимости
# перекрёстных ссылок (ToC, кросс-главные ссылки на приложения), в отличие от
# одиночного вызова xelatex. Так `make build` формирует корректные ссылки без
# ручных повторных проходов.
pdf-engine = "latexmk"
pdf-engine-opts = ["-xelatex", "-interaction=nonstopmode"]
# Подсветка ключевых слов языка В ТЕКСТЕ (не в блоках кода): lua-фильтр pandoc
# `keywords.lua` печатает инлайн-код, равный ключевому слову Takt (`model`, `if`,
# …), моноширинным+жирным+цветом (tango KeywordTok #204A87), чтобы отличать его от
# постороннего слова. Путь — относительно каталога book/.
filters = ["keywords.lua"]
# Подсветка синтаксиса Takt: KDE/kate-определение подключается в skylighting
# (движок pandoc). Блоки ```takt подсвечиваются согласно takt.kate.xml. Путь —
# относительно каталога book/ (откуда mdbook-pandoc запускает pandoc).
syntax-definitions = ["takt.kate.xml"]
highlight-style = "tango"

# Опции pandoc: оглавление с нумерацией разделов (дублирует автонумерацию mdBook в
# структуре документа), ссылки.
[output.pandoc.profile.pdf.variables]
# Шрифт ТЕКСТА документа — Fira Code (по требованию). Моноширинный шрифт кода —
# тоже Fira Code (единый вид). Требуется установленный в системе шрифт Fira Code
# (fontspec/xelatex резолвит по имени семейства).
mainfont = "Fira Code"
monofont = "Fira Code"
# У Fira Code нет курсивного начертания. Без синтетического курсива xelatex на
# каждом курсивном фрагменте (комментарии в подсветке кода `\CommentTok`,
# `\emph`-текст библиографии) печатает предупреждение «Font shape .../m/it
# undefined». AutoFakeSlant определяет наклонное начертание из прямого — курсив
# рендерится синтетически, предупреждения исчезают.
mainfontoptions = ["AutoFakeSlant=0.2"]
monofontoptions = ["AutoFakeSlant=0.2"]
fontsize = "10pt"
lang = "ru"
# Поля страницы — по 1.5 см со всех сторон (по требованию; дефолт geometry ~2.5 см
# давал слишком широкие поля).
geometry = ["margin=1.5cm"]
toc = true
toccolor = "black"
numbersections = true
colorlinks = true
linkcolor = "black"
urlcolor = "blue"
# Перенос длинных строк в блоках кода. Порождённый код (приложение «Порождённый
# код примера») содержит строки шире печатной полосы (напр. дефолтный HAL в
# c-hal — одной строкой); без переноса они уходят за поле (Overfull hbox, текст
# обрезается). fvextra с breaklines/breakanywhere переносит их. commandchars
# оставлены как у pandoc по умолчанию (`\\\{\}`) — иначе подсветка синтаксиса
# сломается.
# Верхний колонтитул с названием раздела (фича 0142). Класс документа — `report`
# (главы `\chapter`), поэтому `\leftmark` несёт заголовок текущей главы, а
# `\chapter` сам переводит ПЕРВУЮ страницу главы в стиль `plain` (без колонтитула)
# — ровно то исключение, которого требует фича: на странице начала раздела его имя
# и так стоит заголовком. `\chaptermark` переопределён на «только заголовок» (без
# англоязычного «Chapter N.»/русского «Глава N.», которого нет в структуре mdBook);
# `plain` переопределён, чтобы на первой странице главы остался лишь номер страницы.
#
# Передний блок (титул, оглавление) колонтитула НЕ несёт (требование фичи): стиль
# по умолчанию — `plain`, а на `fancy` документ переключается с ПЕРВОГО `\part`
# (etoolbox `\pretocmd`). Так `\tableofcontents`, ставящий метку `Содержание`
# через `\@mkboth`, остаётся без колонтитула, а страницы-разделители `\part` — тоже
# `plain` (их имя и так стоит заголовком).
header-includes = [
  '\usepackage{fvextra}',
  '\DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,breakanywhere,commandchars=\\\{\}}',
  '\usepackage{fancyhdr}',
  '\renewcommand{\chaptermark}[1]{\markboth{#1}{}}',
  '\pagestyle{fancy}',
  '\fancyhf{}',
  '\fancyhead[R]{\nouppercase{\leftmark}}',
  '\fancyfoot[C]{\thepage}',
  '\makeatletter',
  '\renewcommand{\headrule}{\protected@edef\@tempa{\leftmark}\ifx\@tempa\@empty\else\hrule\@height0.4pt\@width\headwidth\vskip-0.4pt\fi}',
  '\AtBeginDocument{\let\taktoldtoc\tableofcontents\renewcommand{\tableofcontents}{\begingroup\renewcommand{\@mkboth}[2]{}\taktoldtoc\endgroup\markboth{}{}}}',
  '\makeatother',
  '\fancypagestyle{plain}{\fancyhf{}\fancyfoot[C]{\thepage}\renewcommand{\headrule}{}}',
]
