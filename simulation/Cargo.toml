[package]
name = "simulation"
version = "0.6.0"
authors = ["Pastor <viruszold@gmail.com>"]
description = "Lam"
homepage = "https://but.ru"
repository = "https://github.com/Pastor/BuT"
readme = "../README.md"
keywords = ["Lam", "framework", "simulation"]
license = "BSD"
edition = "2024"
include = ["Cargo.toml", "src/**/*", "README.md", "LICENSE*"]

[[bin]]
name = "simulation"
path = "src/bin/simulation.rs"

[dependencies]
grammar = { path = "../grammar" }
log = "0.4.29"
svg = "0.18.0"
petgraph = "0.8.3"
rand = "0.10.1"
rand_distr = "0.6.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.44"
base64 = "0.22"
gif = "0.13"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[features]
default = []
