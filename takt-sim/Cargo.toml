[package]
name = "takt-sim"
version = "0.6.0"
authors = ["Pastor <viruszold@gmail.com>"]
description = "Takt"
homepage = "https://but.ru"
repository = "https://github.com/Pastor/BuT"
readme = "../README.md"
keywords = ["Takt", "framework", "simulation"]
license = "BSD"
edition = "2024"
# MSRV: проверено на пине толчейна (rust-toolchain.toml). Нижняя граница
# специально не исследовалась — объявлена та версия, на которой гоняются гейты.
rust-version = "1.97"
include = ["Cargo.toml", "src/**/*", "README.md", "LICENSE*"]

[[bin]]
name = "takt-sim"
path = "src/bin/takt_sim.rs"

[dependencies]
takt-lang = { path = "../takt-lang" }
log = "0.4.29"
svg = "0.18.0"
petgraph = "0.8.3"
rand = "0.10.1"
rand_distr = "0.6.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.47.0"
base64 = "0.23.0"
gif = "0.14.2"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[features]
default = []
